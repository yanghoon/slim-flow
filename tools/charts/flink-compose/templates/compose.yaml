# https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/deployment/resource-providers/standalone/docker/#flink-with-docker-compose
# https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/dev/table/catalogs/#catalog-store-configuration
# https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/deployment/config/#env-log-level
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }} 

services:
  {{- if .Values.compose.jobmanager.enabled }}
  jobmanager:
    image: {{ $image }}
    ports:
      - {{ .Values.jobmanager.service.ports.rpc }}:{{ .Values.jobmanager.containerPorts.rpc }}
      - {{ .Values.jobmanager.service.ports.http }}:{{ .Values.jobmanager.containerPorts.http }}
    command: jobmanager
    # volumes:
    #   # - ./conf/catalog:/opt/flink/conf/catalog
    #   - ./lib/iceberg-flink-runtime-1.20-1.9.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.20-1.9.2.jar
    #   - ./lib/iceberg-aws-bundle-1.9.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.9.2.jar
    #   - ./lib/flink-s3-fs-hadoop-1.20.1.jar:/opt/flink/lib/lib/flink-s3-fs-hadoop-1.20.1.jar
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-your-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-your-secret-key}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-iceberg}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      ENV_LOG_LEVEL: ${ENV_LOG_LEVEL:-INFO}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      FLINK_PROPERTIES: |
{{ .Values.compose.jobmanager.environment.FLINK_PROPERTIES | indent 8 }}
    scale: 1
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8081"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
  {{- end }}

  {{- if .Values.compose.taskmanager.enabled }}
  taskmanager:
    image: {{ $image }}
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    # volumes:
    #   # - ./conf/catalog:/opt/flink/conf/catalog
    #   - ./lib/iceberg-flink-runtime-1.20-1.9.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.20-1.9.2.jar
    #   - ./lib/iceberg-aws-bundle-1.9.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.9.2.jar
    #   - ./lib/flink-s3-fs-hadoop-1.20.1.jar:/opt/flink/lib/lib/flink-s3-fs-hadoop-1.20.1.jar
    #   - ./lib/hadoop-mapreduce-client-core-3.3.1.jar:/opt/flink/lib/hadoop-mapreduce-client-core-3.3.1.jar
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-your-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-your-secret-key}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-iceberg}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      ENV_LOG_LEVEL: ${ENV_LOG_LEVEL:-INFO}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      FLINK_PROPERTIES: |
{{ .Values.compose.taskmanager.environment.FLINK_PROPERTIES | indent 8 }}
  {{- end }} 

  {{- if .Values.compose.sqlgateway.enabled }}
  sql-gateway:
    # docker compose up -d minio iceberg-rest jobmanager
    # docker compose up sql-gateway
    image: {{ $image }}
    command: {{ .Values.compose.sqlgateway.command }}
    depends_on:
      - jobmanager
    ports:
      - {{ .Values.compose.sqlgateway.service.ports.http }}:{{ .Values.compose.sqlgateway.containerPorts.http }}
    volumes:
      - ./conf/catalog:/opt/flink/conf/catalog
      # - ./lib/iceberg-flink-runtime-1.20-1.9.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.20-1.9.2.jar
      # - ./lib/iceberg-aws-bundle-1.9.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.9.2.jar
      # - ./lib/flink-s3-fs-hadoop-1.20.1.jar:/opt/flink/lib/lib/flink-s3-fs-hadoop-1.20.1.jar
      # - ./lib/hadoop-hdfs-client-3.3.1.jar:/opt/flink/lib/hadoop-hdfs-client-3.3.1.jar
    environment:
      # https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/dev/table/sql-gateway/overview/#starting-the-sql-gateway
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-your-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-your-secret-key}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-iceberg}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      ENV_LOG_LEVEL: ${ENV_LOG_LEVEL:-INFO}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      FLINK_PROPERTIES: |
{{ .Values.compose.sqlgateway.environment.FLINK_PROPERTIES | indent 8 }}
  {{- end }} 
