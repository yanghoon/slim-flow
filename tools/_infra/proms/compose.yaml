version: '3.8'

services:
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
      args:
        # GF_INSTALL_PLUGINS: "${GF_INSTALL_PLUGINS:-}"
        GF_INSTALL_PLUGINS: trino-datasource
    image: grafana-plugins:latest
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_INSTALL_PLUGINS: "${GF_INSTALL_PLUGINS:-}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trino-sample-dashboard.json
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: trino-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
  
  loki:
    image: grafana/loki:3.5.5
    # command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100
    # volumes:
    #   - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    # restart: unless-stopped

volumes:
  grafana-data:
