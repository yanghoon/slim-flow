[SERVICE]
    Flush       1
    Daemon      Off
    Log_Level   trace
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name        tail
    Path        /var/log/nginx/*.log
    Tag         nginx.*
    Parser      nginx
    Read_from_Head true

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100

[OUTPUT]
    Name        stdout
    Match       *
