# https://github.com/apache/hive/blob/master/packaging/src/docker/docker-compose.yml
# https://hive.apache.org/development/quickstart/

# version: '3.9'

services:
  postgres:
    image: postgres:latest
    # restart: unless-stopped
    # container_name: postgres
    # hostname: postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - hive-db:/var/lib/postgresql
  #   networks:
  #     - hive

  metastore:
    image: apache/hive:${HIVE_VERSION}
    depends_on:
      - postgres
    # restart: unless-stopped
    # container_name: metastore
    hostname: metastore
    environment:
      # https://hive.apache.org/docs/latest/adminmanual-metastore-administration_27362076/
      # https://github.com/apache/hive/blob/master/packaging/src/docker/entrypoint.sh#L32C18-L32C28
      # https://hive.apache.org/docs/latest/hive-schema-tool_34835119/
      DB_DRIVER: postgres
      SERVICE_NAME: metastore
      SERVICE_OPTS: -Xmx1G
                    -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                    -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
                    -Djavax.jdo.option.ConnectionUserName=hive
                    -Djavax.jdo.option.ConnectionPassword=password
    ports:
        - 9083:9083
    volumes:
        - warehouse:/opt/hive/data/warehouse
        - ${HIVE_POSTGRES_DRIVER_PATH}:/opt/hive/lib/postgresql.jar
        # - ./sqlite-jdbc-3.49.1.0.jar:/opt/hive/lib/sqlite-jdbc.jar
        # - ./metastore.db:/opt/hive/metastore.db
        # - type: bind
        #   source: ${POSTGRES_LOCAL_PATH}
        #   target: /opt/hive/lib/postgres.jar
    # networks:
    #   - hive

  hiveserver2:
    image: apache/hive:${HIVE_VERSION}
    depends_on:
      - metastore
    # restart: unless-stopped
    # container_name: hiveserver2
    environment:
      HIVE_SERVER2_THRIFT_PORT: 10000
      SERVICE_OPTS: -Xmx1G -Dhive.metastore.uris=thrift://metastore:9083
      IS_RESUME: true
      SERVICE_NAME: hiveserver2
    ports:
      - 10000:10000
      - 10002:10002
    volumes:
      - warehouse:/opt/hive/data/warehouse
  #   networks:
  #     - hive

volumes:
  hive-db:
  warehouse:
# networks:
#   hive:
#     name: hive
