# https://trino.io/docs/current/connector/iceberg.html
connector.name=iceberg

# https://trino.io/docs/current/object-storage/metastores.html#rest-catalog
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

# https://trino.io/docs/current/object-storage/metastores.html#jdbc-catalog
# iceberg.catalog.type=jdbc
# iceberg.jdbc-catalog.catalog-name=test
# iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
# iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/metastore_db
# iceberg.jdbc-catalog.connection-user=iceberg
# iceberg.jdbc-catalog.connection-password=password
# iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse

fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_AWS_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_AWS_SECRET_KEY}
s3.path-style-access=true
